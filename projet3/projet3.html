<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Document</title>
      <link rel="stylesheet" href="projet3.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
   </head>
   <body>
      <div id="container">
         <h1>Let's count our costs!</h1>
         <form>
            <p>💰Budget</p>
            <spain>💲<input  id="budget" type="text" placeholder="Budget..."></spain>
            <p>👪Family Members</p>
            <spain><input  id="people"type="text" placeholder="How many people?..."></spain>
            <p> ❤️You will enjoy managing your budget!❤️</p>
            <button id="addFunMoney">Add Fun Money</button>
            <select id="select">
               <option disabled>Select an option</option>
               <option value="0.20"> 💃Wow 20%</option>
               <option value="0.15"> 🤩Good 15% </option>
               <option value="0.10" selected> 👌It's ok 10%</option>
            </select>
            <button id="calculate">Calculate</button>
         </form>
         <div id="costs">
            <div id="fixedCosts">
               <p>Fixed Costs</p>
               <span>💲</span>
               <span id="one"></span>
               <span>per person</span>
            </div>
            <div id="variableCosts">
               <p class="pOne">Variable Costs</p>
               <span>💲</span>
               <span id="two"></span>
               <span>per person</span>
            </div>
            <div id="totalCosts">
               <p>Total Costs</p>
               <span>💲</span>
               <span id="three"></span>
               <span>per person</span>
            </div>
         </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
      <script src="projet3.js"></script>
   </body>
</html>
