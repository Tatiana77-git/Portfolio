
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo</title>
    <link rel="stylesheet" href="project4.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <div id="container">
       <div id="header">
        <input id="input" type="text" spellcheck="false" placeholder="Please enter city...">
       </div>


    <div id="when-where">
       <p id="city">Montreal, Canada</p>
        <p id="date"> Tuesday, 27 July 2021</p>
    </div>
    
    <div id="now">
        <p id="temperature">28°</p>
        <p id="feelsLike">Feels like: 30°</p>
        <p id="conditions">Sunny</p>
        <p id="varation">Min: 25° Max:28°</p>
    </div>


    </div>
    


 <script src="project4.js"></script>   
</body>
